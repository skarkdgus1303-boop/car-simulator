<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Night City Drive Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; background: #030308; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        #selector-screen {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(3, 3, 8, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(12px);
        }
        h1 { color: #ff007f; margin-bottom: 8px; font-size: 32px; text-shadow: 0 0 20px rgba(255,0,127,0.6); }
        .sub-title { color: #88a; margin-bottom: 30px; font-size: 15px; }
        .car-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            max-width: 1100px;
        }
        .car-card {
            background: rgba(15, 15, 25, 0.9);
            border: 2px solid #223;
            border-radius: 14px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .car-card:hover {
            border-color: #ff007f;
            transform: translateY(-8px);
            box-shadow: 0 10px 30px rgba(255,0,127,0.4);
            background: rgba(25, 20, 35, 0.9);
        }
        .car-brand { font-size: 13px; color: #88a; margin-bottom: 6px; font-weight: bold; }
        .car-name { font-size: 18px; color: #fff; margin-bottom: 15px; font-weight: bold; }
        .select-btn {
            background: #ff007f;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .select-btn:hover { background: #e00070; }

        #ui {
            position: absolute;
            top: 20px; left: 20px;
            color: #fff;
            background: rgba(5, 5, 12, 0.85);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            pointer-events: none;
            width: 300px;
            border: 1px solid rgba(255,0,127,0.3);
            z-index: 5;
            display: none;
        }
        h3 { margin: 0 0 12px 0; font-size: 18px; color: #ff007f; border-bottom: 1px solid #334; padding-bottom: 6px; }
        .dash { font-size: 32px; color: #ff007f; text-align: right; margin-top: 10px; font-weight: bold; text-shadow: 0 0 10px rgba(255,0,127,0.4); }
        .status { font-size: 13px; color: #aaa; margin: 6px 0; font-weight: bold; }
        .on { color: #00ffcc !important; text-shadow: 0 0 8px rgba(0,255,200,0.6); }
        .blink-on { color: #ffaa00 !important; text-shadow: 0 0 8px rgba(255,170,0,0.8); }
    </style>
</head>
<body>

    <div id="selector-screen">
        <h1>🌃 NIGHT CITY DRIVE</h1>
        <div class="sub-title">화려한 야경 속을 달릴 차량을 선택하세요</div>
        <div class="car-grid">
            <div class="car-card" onclick="selectCar('GENESIS')">
                <div class="car-brand">GENESIS</div>
                <div class="car-name">G80</div>
                <button class="select-btn">선택하기</button>
            </div>
            <div class="car-card" onclick="selectCar('HYUNDAI')">
                <div class="car-brand">HYUNDAI</div>
                <div class="car-name">그랜저</div>
                <button class="select-btn">선택하기</button>
            </div>
            <div class="car-card" onclick="selectCar('KIA')">
                <div class="car-brand">KIA</div>
                <div class="car-name">K5</div>
                <button class="select-btn">선택하기</button>
            </div>
            <div class="car-card" onclick="selectCar('BMW')">
                <div class="car-brand">BMW</div>
                <div class="car-name">M5</div>
                <button class="select-btn">선택하기</button>
            </div>
            <div class="car-card" onclick="selectCar('BENZ')">
                <div class="car-brand">MERCEDES-BENZ</div>
                <div class="car-name">E-Class</div>
                <button class="select-btn">선택하기</button>
            </div>
        </div>
    </div>

    <div id="ui">
        <h3 id="current-car-title">🌃 NIGHT DRIVE</h3>
        <div class="dash" id="speedo">0 km/h</div>
        <div class="status" id="light-status">라이트 (L): ON</div>
        <div class="status" id="left-status">좌측 깜빡이 (Q): OFF</div>
        <div class="status" id="right-status">우측 깜빡이 (E): OFF</div>
        <div class="status" id="hazard-status">비상등 (H): OFF</div>
        <div class="status" id="brake-status">브레이크 / 후진: OFF</div>
        <hr style="border:0; border-top:1px solid #334; margin:10px 0;">
        <div style="font-size:11px; color:#88a; line-height: 1.6; font-weight: normal;">
            [↑ / ↓] 전진 및 브레이크/후진<br>
            [← / →] 좌우 핸들 조작<br>
            [마우스 드래그] 주변 자유 시점<br>
            [C] 운전석 / 3인칭 시점 변경
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer;
        let carGroup, wheels = [], headLightL, headLightR, frontBlinkerL, frontBlinkerR, rearBlinkerL, rearBlinkerR, tailLightMat, headLightMat, frontBlinkerMatL, frontBlinkerMatR, rearBlinkerMatL, rearBlinkerMatR;
        let headLightSpotL, headLightSpotR;
        let simulationStarted = false;

        function initNightCityEnvironment() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020206);
            scene.fog = new THREE.FogExp2(0x020206, 0.0035);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 야간 은은한 달빛/주변광
            const ambientLight = new THREE.AmbientLight(0x111933, 0.8);
            scene.add(ambientLight);

            const moonLight = new THREE.DirectionalLight(0x3b5998, 0.5);
            moonLight.position.set(100, 200, 100);
            scene.add(moonLight);

            const cityGroup = new THREE.Group();
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x0c0c10, roughness: 0.6, metalness: 0.2 });
            const road = new THREE.Mesh(new THREE.PlaneGeometry(26, 30000), roadMat);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            cityGroup.add(road);

            const yellowLineMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
            const whiteLineMat = new THREE.MeshBasicMaterial({ color: 0xcccccc });
            
            for(let i = -15000; i < 15000; i += 12) {
                const centerLine = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 6), yellowLineMat);
                centerLine.rotation.x = -Math.PI / 2;
                centerLine.position.set(0, 0.02, i);
                cityGroup.add(centerLine);

                const lane1 = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 5), whiteLineMat);
                lane1.rotation.x = -Math.PI / 2;
                lane1.position.set(-6.5, 0.02, i);
                cityGroup.add(lane1);

                const lane2 = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 5), whiteLineMat);
                lane2.rotation.x = -Math.PI / 2;
                lane2.position.set(6.5, 0.02, i);
                cityGroup.add(lane2);
            }

            const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x222228, roughness: 0.9 });
            const leftSidewalk = new THREE.Mesh(new THREE.BoxGeometry(9, 0.35, 30000), sidewalkMat);
            leftSidewalk.position.set(-17.5, 0.175, 0);
            cityGroup.add(leftSidewalk);

            const rightSidewalk = new THREE.Mesh(new THREE.BoxGeometry(9, 0.35, 30000), sidewalkMat);
            rightSidewalk.position.set(17.5, 0.175, 0);
            cityGroup.add(rightSidewalk);

            const poleMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1f });

            for(let i = -10000; i < 10000; i += 60) {
                const leftPole = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 10), poleMat);
                leftPole.position.set(-21, 5, i);
                cityGroup.add(leftPole);

                const rightPole = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 10), poleMat);
                rightPole.position.set(21, 5, i);
                cityGroup.add(rightPole);

                // 가로등 불빛 (노란빛)
                if (i % 120 === 0) {
                    const streetLightL = new THREE.PointLight(0xffaa44, 2, 35);
                    streetLightL.position.set(-21, 9, i);
                    cityGroup.add(streetLightL);

                    const streetLightR = new THREE.PointLight(0xffaa44, 2, 35);
                    streetLightR.position.set(21, 9, i);
                    cityGroup.add(streetLightR);
                }

                // 고층 빌딩과 창문 불빛들
                const h1 = 50 + Math.abs(Math.sin(i * 0.12)) * 110;
                const h2 = 50 + Math.abs(Math.cos(i * 0.12)) * 110;
                const bMat = new THREE.MeshStandardMaterial({ color: 0x090b12, roughness: 0.2 });

                const leftBldg = new THREE.Mesh(new THREE.BoxGeometry(40, h1, 50), bMat);
                leftBldg.position.set(-42, h1 / 2, i);
                cityGroup.add(leftBldg);

                const rightBldg = new THREE.Mesh(new THREE.BoxGeometry(40, h2, 50), bMat);
                rightBldg.position.set(42, h2 / 2, i);
                cityGroup.add(rightBldg);

                // 빌딩 창문 야경 불빛 효과 (랜덤 큐브들)
                for(let wY = 10; wY < h1 - 10; wY += 12) {
                    if ((i + wY) % 3 === 0) {
                        const windowMat = new THREE.MeshBasicMaterial({ color: (i % 2 === 0) ? 0xffea79 : 0x79d2ff });
                        const winBlock = new THREE.Mesh(new THREE.BoxGeometry(35, 4, 0.5), windowMat);
                        winBlock.position.set(-42, wY, i + 25.2);
                        cityGroup.add(winBlock);
                    }
                }

                // 네온사인 간판
                const neonColors = [0xff0055, 0x00ffff, 0xffaa00, 0x00ff66, 0xcc00ff];
                const neonMat = new THREE.MeshBasicMaterial({ color: neonColors[Math.abs(i) % neonColors.length] });
                const neonSign = new THREE.Mesh(new THREE.BoxGeometry(14, 1.6, 0.6), neonMat);
                neonSign.position.set(-22, 4, i + 10);
                cityGroup.add(neonSign);

                const neonMat2 = new THREE.MeshBasicMaterial({ color: neonColors[(Math.abs(i) + 1) % neonColors.length] });
                const neonSign2 = new THREE.Mesh(new THREE.BoxGeometry(14, 1.6, 0.6), neonMat2);
                neonSign2.position.set(22, 4, i + 15);
                cityGroup.add(neonSign2);
            }
            scene.add(cityGroup);
        }

        window.selectCar = function(type) {
            document.getElementById('selector-screen').style.display = 'none';
            document.getElementById('ui').style.display = 'block';

            let bodyColor = 0x111622;
            let brandTitle = "GENESIS G80";

            if (type === 'GENESIS') { bodyColor = 0x111622; brandTitle = "제네시스 G80"; }
            else if (type === 'HYUNDAI') { bodyColor = 0x22222a; brandTitle = "현대 그랜저"; }
            else if (type === 'KIA') { bodyColor = 0x990022; brandTitle = "기아 K5"; }
            else if (type === 'BMW') { bodyColor = 0x0a3366; brandTitle = "BMW M5"; }
            else if (type === 'BENZ') { bodyColor = 0x1c2833; brandTitle = "벤츠 E-Class"; }

            document.getElementById('current-car-title').innerText = `🌃 ${brandTitle}`;

            initNightCityEnvironment();

            carGroup = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: bodyColor, metalness: 0.9, roughness: 0.15 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.7, 4.6), bodyMat);
            body.position.y = 0.45;
            body.castShadow = true;
            carGroup.add(body);

            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x050508, metalness: 0.95, roughness: 0.05 });
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.55, 0.5, 2.2), cabinMat);
            cabin.position.set(0, 0.92, -0.15);
            carGroup.add(cabin);

            // 헤드라이트 (밝게 빛나는 네온 발광)
            headLightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            headLightL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.12, 0.1), headLightMat);
            headLightL.position.set(-0.7, 0.48, 2.31);
            carGroup.add(headLightL);
            headLightR = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.12, 0.1), headLightMat);
            headLightR.position.set(0.7, 0.48, 2.31);
            carGroup.add(headLightR);

            // 실제 전방을 비추는 헤드라이트 스포트라이트
            headLightSpotL = new THREE.SpotLight(0xffffff, 4, 40, Math.PI / 4, 0.5, 1);
            headLightSpotL.position.set(-0.7, 0.48, 2.31);
            headLightSpotL.target.position.set(-0.7, 0, 20);
            carGroup.add(headLightSpotL);
            carGroup.add(headLightSpotL.target);

            headLightSpotR = new THREE.SpotLight(0xffffff, 4, 40, Math.PI / 4, 0.5, 1);
            headLightSpotR.position.set(0.7, 0.48, 2.31);
            headLightSpotR.target.position.set(0.7, 0, 20);
            carGroup.add(headLightSpotR);
            carGroup.add(headLightSpotR.target);

            frontBlinkerMatL = new THREE.MeshBasicMaterial({ color: 0x332200 });
            frontBlinkerMatR = new THREE.MeshBasicMaterial({ color: 0x332200 });
            frontBlinkerL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.12, 0.1), frontBlinkerMatL);
            frontBlinkerL.position.set(-0.95, 0.48, 2.31);
            carGroup.add(frontBlinkerL);
            frontBlinkerR = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.12, 0.1), frontBlinkerMatR);
            frontBlinkerR.position.set(0.95, 0.48, 2.31);
            carGroup.add(frontBlinkerR);

            tailLightMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const tailLightL = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.15, 0.1), tailLightMat);
            tailLightL.position.set(-0.7, 0.5, -2.31);
            carGroup.add(tailLightL);
            const tailLightR = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.15, 0.1), tailLightMat);
            tailLightR.position.set(0.7, 0.5, -2.31);
            carGroup.add(tailLightR);

            rearBlinkerMatL = new THREE.MeshBasicMaterial({ color: 0x332200 });
            rearBlinkerMatR = new THREE.MeshBasicMaterial({ color: 0x332200 });
            rearBlinkerL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.15, 0.1), rearBlinkerMatL);
            rearBlinkerL.position.set(-0.25, 0.5, -2.31);
            carGroup.add(rearBlinkerL);
            rearBlinkerR = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.15, 0.1), rearBlinkerMatR);
            rearBlinkerR.position.set(0.25, 0.5, -2.31);
            carGroup.add(rearBlinkerR);

            const wheelGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.35, 24);
            wheelGeo.rotateZ(Math.PI / 2);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
            wheels = [];
            const wPos = [[-0.95, 0.38, 1.4], [0.95, 0.38, 1.4], [-0.95, 0.38, -1.4], [0.95, 0.38, -1.4]];
            wPos.forEach(p => {
                const w = new THREE.Mesh(wheelGeo, wheelMat);
                w.position.set(...p);
                carGroup.add(w);
                wheels.push(w);
            });

            carGroup.position.set(0, 0, 0);
            scene.add(carGroup);

            simulationStarted = true;
            initAudio();
        };

        let audioCtx = null;
        let engineOsc = null;
        let engineGain = null;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            engineOsc = audioCtx.createOscillator();
            engineOsc.type = 'sawtooth';
            engineOsc.frequency.setValueAtTime(35, audioCtx.currentTime);

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(140, audioCtx.currentTime);

            engineGain = audioCtx.createGain();
            engineGain.gain.setValueAtTime(0, audioCtx.currentTime);

            engineOsc.connect(filter);
            filter.connect(engineGain);
            engineGain.connect(audioCtx.destination);
            engineOsc.start();
        }

        function playTickSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        let speed = 0;
        let maxSpeed = 1.35;
        let acceleration = 0.02;
        let deceleration = 0.012;
        let maxSteering = 0.045;

        let isLightOn = true;
        let leftBlinker = false;
        let rightBlinker = false;
        let hazardOn = false;
        let blinkTimer = 0;
        let isFirstPerson = false;

        let isDragging = false;
        let mouseX = 0, mouseY = 0;
        let cameraAngleY = 0;
        let cameraAngleX = 0.3;

        window.addEventListener('mousedown', (e) => { isDragging = true; mouseX = e.clientX; mouseY = e.clientY; });
        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - mouseX;
            const deltaY = e.clientY - mouseY;
            mouseX = e.clientX;
            mouseY = e.clientY;
            cameraAngleY -= deltaX * 0.005;
            cameraAngleX = Math.max(0.05, Math.min(1.2, cameraAngleX - deltaY * 0.005));
        });

        const keys = { up: false, down: false, left: false, right: false };

        window.addEventListener('keydown', (e) => handleKey(e, true));
        window.addEventListener('keyup', (e) => handleKey(e, false));

        function handleKey(e, isDown) {
            if (!simulationStarted) return;
            if (e.key === 'ArrowUp') keys.up = isDown;
            if (e.key === 'ArrowDown') keys.down = isDown;
            if (e.key === 'ArrowLeft') keys.left = isDown;
            if (e.key === 'ArrowRight') keys.right = isDown;

            const key = e.key.toUpperCase();
            if (isDown) {
                if (key === 'L') {
                    isLightOn = !isLightOn;
                    document.getElementById('light-status').innerText = `라이트 (L): ${isLightOn ? 'ON' : 'OFF'}`;
                    document.getElementById('light-status').className = `status ${isLightOn ? 'on' : ''}`;
                }
                if (key === 'Q') {
                    leftBlinker = !leftBlinker;
                    if (leftBlinker) rightBlinker = false;
                    document.getElementById('left-status').innerText = `좌측 깜빡이 (Q): ${leftBlinker ? 'ON' : 'OFF'}`;
                    document.getElementById('left-status').className = `status ${leftBlinker ? 'blink-on' : ''}`;
                    document.getElementById('right-status').innerText = `우측 깜빡이 (E): OFF`;
                    document.getElementById('right-status').className = `status`;
                }
                if (key === 'E') {
                    rightBlinker = !rightBlinker;
                    if (rightBlinker) leftBlinker = false;
                    document.getElementById('right-status').innerText = `우측 깜빡이 (E): ${rightBlinker ? 'ON' : 'OFF'}`;
                    document.getElementById('right-status').className = `status ${rightBlinker ? 'blink-on' : ''}`;
                    document.getElementById('left-status').innerText = `좌측 깜빡이 (Q): OFF`;
                    document.getElementById('left-status').className = `status`;
                }
                if (key === 'H') {
                    hazardOn = !hazardOn;
                    document.getElementById('hazard-status').innerText = `비상등 (H): ${hazardOn ? 'ON' : 'OFF'}`;
                    document.getElementById('hazard-status').className = `status ${hazardOn ? 'blink-on' : ''}`;
                }
                if (key === 'C') {
                    isFirstPerson = !isFirstPerson;
                    cameraAngleY = 0;
                }
            }
        }

        let lastBlinkState = false;

        function animate() {
            requestAnimationFrame(animate);

            if (simulationStarted) {
                if (keys.up) speed = Math.min(speed + acceleration, maxSpeed);
                else if (keys.down) speed = Math.max(speed - acceleration, -maxSpeed * 0.4);
                else {
                    if (speed > 0) speed = Math.max(speed - deceleration, 0);
                    if (speed < 0) speed = Math.min(speed + deceleration, 0);
                }

                if (Math.abs(speed) > 0.01) {
                    if (keys.left) carGroup.rotation.y += maxSteering * (speed / maxSpeed);
                    if (keys.right) carGroup.rotation.y -= maxSteering * (speed / maxSpeed);
                }

                carGroup.translateZ(speed);
                wheels.forEach(w => { w.rotation.x -= speed * 2; });

                const kmh = Math.round(Math.abs(speed) * 180);
                document.getElementById('speedo').innerText = `${kmh} km/h`;

                const isBraking = keys.down || (speed > 0 && keys.down);
                const isReversing = speed < 0;
                if (isReversing) {
                    tailLightMat.color.set(0xffffff);
                    document.getElementById('brake-status').innerText = `브레이크 / 후진: 후진중 (REVERSE)`;
                    document.getElementById('brake-status').className = `status on`;
                } else if (isBraking) {
                    tailLightMat.color.set(0xff3333);
                    document.getElementById('brake-status').innerText = `브레이크 / 후진: 제동중 (BRAKE)`;
                    document.getElementById('brake-status').className = `status on`;
                } else {
                    tailLightMat.color.set(isLightOn ? 0xff0000 : 0x550000);
                    document.getElementById('brake-status').innerText = `브레이크 / 후진: OFF`;
                    document.getElementById('brake-status').className = `status`;
                }

                if (isLightOn) {
                    headLightMat.color.set(0xffffff);
                    headLightSpotL.intensity = 4;
                    headLightSpotR.intensity = 4;
                } else {
                    headLightMat.color.set(0x333333);
                    headLightSpotL.intensity = 0;
                    headLightSpotR.intensity = 0;
                }

                blinkTimer += 0.016;
                const currentBlinkState = Math.floor(blinkTimer * 3.5) % 2 === 0;
                if (currentBlinkState !== lastBlinkState && (hazardOn || leftBlinker || rightBlinker)) {
                    playTickSound();
                    lastBlinkState = currentBlinkState;
                }

                const showLeft = hazardOn || leftBlinker;
                const showRight = hazardOn || rightBlinker;

                frontBlinkerMatL.color.set(showLeft && currentBlinkState ? 0xffaa00 : 0x332200);
                rearBlinkerMatL.color.set(showLeft && currentBlinkState ? 0xffaa00 : 0x332200);
                frontBlinkerMatR.color.set(showRight && currentBlinkState ? 0xffaa00 : 0x332200);
                rearBlinkerMatR.color.set(showRight && currentBlinkState ? 0xffaa00 : 0x332200);

                if (currentBlinkState !== lastBlinkState) {
                    lastBlinkState = currentBlinkState;
                }

                if (engineGain && audioCtx) {
                    const engineVol = Math.min(0.25, Math.abs(speed) * 0.2);
                    engineGain.gain.setTargetAtTime(engineVol, audioCtx.currentTime, 0.1);
                    engineOsc.frequency.setTargetAtTime(35 + Math.abs(speed) * 90, audioCtx.currentTime, 0.1);
                }

                if (isFirstPerson) {
                    camera.position.set(
                        carGroup.position.x - Math.sin(carGroup.rotation.y) * 0.2,
                        carGroup.position.y + 0.9,
                        carGroup.position.z - Math.cos(carGroup.rotation.y) * 0.2
                    );
                    const lookTarget = new THREE.Vector3(
                        carGroup.position.x - Math.sin(carGroup.rotation.y + cameraAngleY) * 20,
                        carGroup.position.y + 0.9 + (cameraAngleX - 0.3) * 10,
                        carGroup.position.z - Math.cos(carGroup.rotation.y + cameraAngleY) * 20
                    );
                    camera.lookAt(lookTarget);
                } else {
                    const dist = 7.5;
                    const camX = carGroup.position.x - Math.sin(carGroup.rotation.y + cameraAngleY) * dist;
                    const camZ = carGroup.position.z - Math.cos(carGroup.rotation.y + cameraAngleY) * dist;
                    
                    camera.position.x += (camX - camera.position.x) * 0.15;
                    camera.position.z += (camZ - camera.position.z) * 0.15;
                    camera.position.y = carGroup.position.y + 1.6 + (cameraAngleX * 3);
                    
                    camera.lookAt(carGroup.position.x, carGroup.position.y + 0.5, carGroup.position.z);
                }

                renderer.render(scene, camera);
            }
        }

        animate();

        window.addEventListener('resize', () => {
            if (!simulationStarted) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
