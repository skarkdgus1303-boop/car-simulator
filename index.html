<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Full Urban Traffic Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050510; user-select: none; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            pointer-events: none;
            width: 270px;
            border: 1px solid rgba(0,255,200,0.3);
            z-index: 5;
        }
        h3 { margin: 0 0 12px 0; font-size: 18px; color: #00ffcc; border-bottom: 1px solid #444; padding-bottom: 6px; }
        .dash { font-size: 30px; color: #00ffcc; text-align: right; margin-top: 10px; font-weight: bold; }
        .status { font-size: 13px; color: #ccc; margin: 5px 0; }
    </style>
</head>
<body>

    <div id="ui">
        <h3>🏙️ FULL URBAN SIMULATOR</h3>
        <div class="dash" id="speedo">0 km/h</div>
        <div class="status" id="light-status">라이트 (L): OFF</div>
        <div class="status" id="left-status">좌측 깜빡이 (Q): OFF</div>
        <div class="status" id="right-status">우측 깜빡이 (E): OFF</div>
        <div class="status" id="hazard-status">비상등 (H): OFF</div>
        <hr style="border:0; border-top:1px solid #444; margin:10px 0;">
        <div style="font-size:11px; color:#aaa; line-height: 1.6;">
            [↑ / ↓] 전진 및 후진 (엔진음)<br>
            [← / →] 좌우 핸들 조작<br>
            [마우스 드래그] 주변 자유 시점<br>
            [C] 운전석 / 3인칭 시점 변경
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.005);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 조명 설정
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(50, 120, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 🛣️ 도시 환경 (도로, 인도, 건물, 가로수, 횡단보도, 신호등) 생성
        const cityGroup = new THREE.Group();

        // 1. 아스팔트 도로
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.9 });
        const road = new THREE.Mesh(new THREE.PlaneGeometry(24, 20000), roadMat);
        road.rotation.x = -Math.PI / 2;
        road.receiveShadow = true;
        cityGroup.add(road);

        // 2. 차선 및 중앙선, 횡단보도
        const yellowLineMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const whiteLineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        
        for(let i = -10000; i < 10000; i += 12) {
            // 중앙선
            const centerLine = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 6), yellowLineMat);
            centerLine.rotation.x = -Math.PI / 2;
            centerLine.position.set(0, 0.02, i);
            cityGroup.add(centerLine);

            // 차선
            const lane1 = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 5), whiteLineMat);
            lane1.rotation.x = -Math.PI / 2;
            lane1.position.set(-6, 0.02, i);
            cityGroup.add(lane1);

            const lane2 = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 5), whiteLineMat);
            lane2.rotation.x = -Math.PI / 2;
            lane2.position.set(6, 0.02, i);
            cityGroup.add(lane2);

            // 횡단보도 (일정 간격마다)
            if (i % 300 === 0) {
                for(let zOff = -2; zOff <= 2; zOff += 1) {
                    const crossWalk = new THREE.Mesh(new THREE.PlaneGeometry(22, 0.6), whiteLineMat);
                    crossWalk.rotation.x = -Math.PI / 2;
                    crossWalk.position.set(0, 0.03, i + zOff);
                    cityGroup.add(crossWalk);
                }
            }
        }

        // 3. 인도 (보도블록)
        const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.8 });
        const leftSidewalk = new THREE.Mesh(new THREE.BoxGeometry(8, 0.3, 20000), sidewalkMat);
        leftSidewalk.position.set(-16, 0.15, 0);
        cityGroup.add(leftSidewalk);

        const rightSidewalk = new THREE.Mesh(new THREE.BoxGeometry(8, 0.3, 20000), sidewalkMat);
        rightSidewalk.position.set(16, 0.15, 0);
        cityGroup.add(rightSidewalk);

        const aiCars = [];
        const pedestrians = [];

        // 4. 고층 빌딩, 가로수, 신호등, 사람 배치
        const treeLeavesMat = new THREE.MeshStandardMaterial({ color: 0x1e5631, roughness: 0.7 });
        const treeTrunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9 });

        for(let i = -8000; i < 8000; i += 50) {
            // 가로등
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const leftPole = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 10), poleMat);
            leftPole.position.set(-19.5, 5, i);
            cityGroup.add(leftPole);

            const rightPole = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 10), poleMat);
            rightPole.position.set(19.5, 5, i);
            cityGroup.add(rightPole);

            // 가로수 (나무)
            if (i % 100 === 0) {
                // 왼쪽 나무
                const trunkL = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 3), treeTrunkMat);
                trunkL.position.set(-16, 1.5, i + 25);
                cityGroup.add(trunkL);
                const leavesL = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 8), treeLeavesMat);
                leavesL.position.set(-16, 3.5, i + 25);
                cityGroup.add(leavesL);

                // 오른쪽 나무
                const trunkR = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 3), treeTrunkMat);
                trunkR.position.set(16, 1.5, i + 25);
                cityGroup.add(trunkR);
                const leavesR = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 8), treeLeavesMat);
                leavesR.position.set(16, 3.5, i + 25);
                cityGroup.add(leavesR);
            }

            // 고층 빌딩 군집
            const h1 = 50 + Math.abs(Math.sin(i * 0.1)) * 100;
            const h2 = 50 + Math.abs(Math.cos(i * 0.1)) * 100;
            const bMat = new THREE.MeshStandardMaterial({ color: 0x111622, roughness: 0.3, metalness: 0.2 });
            
            const leftBldg = new THREE.Mesh(new THREE.BoxGeometry(38, h1, 45), bMat);
            leftBldg.position.set(-40, h1 / 2, i);
            cityGroup.add(leftBldg);

            const rightBldg = new THREE.Mesh(new THREE.BoxGeometry(38, h2, 45), bMat);
            rightBldg.position.set(40, h2 / 2, i);
            cityGroup.add(rightBldg);

            // 신호등 구조물
            if (i % 300 === 0) {
                const lightPole = new THREE.Mesh(new THREE.BoxGeometry(0.6, 7, 0.6), poleMat);
                lightPole.position.set(12, 3.5, i);
                cityGroup.add(lightPole);

                const trafficLightBox = new THREE.Mesh(new THREE.BoxGeometry(1, 2.2, 0.8), poleMat);
                trafficLightBox.position.set(12, 6.5, i);
                cityGroup.add(trafficLightBox);

                const redCircle = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
                redCircle.position.set(12, 7.1, i + 0.45);
                cityGroup.add(redCircle);
            }

            // 보행자 (사람)
            if (i % 120 === 0) {
                const pGroup = new THREE.Group();
                const pMat = new THREE.MeshStandardMaterial({ color: Math.random() > 0.5 ? 0x2255cc : 0xcc2244 });
                
                const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.9, 0.3), pMat);
                torso.position.y = 0.9;
                pGroup.add(torso);

                const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffdbac }));
                head.position.y = 1.5;
                pGroup.add(head);

                pGroup.position.set(-15.5, 0.3, i + Math.random() * 30);
                cityGroup.add(pGroup);
                pedestrians.push(pGroup);
            }

            // 달리는 다른 AI 차량들
            if (i % 200 === 50) {
                const aiCarGeo = new THREE.BoxGeometry(1.9, 0.8, 4.2);
                const aiCarMat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff, metalness: 0.6, roughness: 0.3 });
                const aiCar = new THREE.Mesh(aiCarGeo, aiCarMat);
                aiCar.position.set(i % 2 === 0 ? -6 : 6, 0.4, i);
                cityGroup.add(aiCar);
                aiCars.push({ mesh: aiCar, speed: (i % 2 === 0 ? 0.45 : -0.35) });
            }
        }
        scene.add(cityGroup);

        // 🏎️ 스포츠카 플레이어 모델
        const car = new THREE.Group();
        
        const carMat = new THREE.MeshStandardMaterial({ color: 0x00d2ff, metalness: 0.85, roughness: 0.15 });
        const bodyShape = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.5, 4.5), carMat);
        bodyShape.position.y = 0.45;
        bodyShape.castShadow = true;
        car.add(bodyShape);

        const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111122, metalness: 0.9, roughness: 0.1 });
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.45, 2.0), cabinMat);
        cabin.position.set(0, 0.85, -0.2);
        cabin.castShadow = true;
        car.add(cabin);

        const hood = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.15, 1.2), carMat);
        hood.position.set(0, 0.65, 1.3);
        car.add(hood);

        const wingPillarMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const pillarL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.2), wingPillarMat);
        pillarL.position.set(-0.7, 0.8, -1.9);
        car.add(pillarL);
        const pillarR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.2), wingPillarMat);
        pillarR.position.set(0.7, 0.8, -1.9);
        car.add(pillarR);

        const wing = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.08, 0.4), carMat);
        wing.position.set(0, 0.95, -1.9);
        car.add(wing);

        const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
        const headLightL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.12, 0.1), lightMat);
        headLightL.position.set(-0.7, 0.45, 2.26);
        car.add(headLightL);
        const headLightR = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.12, 0.1), lightMat);
        headLightR.position.set(0.7, 0.45, 2.26);
        car.add(headLightR);

        const tailLightMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const tailLightL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.12, 0.1), tailLightMat);
        tailLightL.position.set(-0.7, 0.5, -2.26);
        car.add(tailLightL);
        const tailLightR = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.12, 0.1), tailLightMat);
        tailLightR.position.set(0.7, 0.5, -2.26);
        car.add(tailLightR);

        const wheelGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.35, 24);
        wheelGeo.rotateZ(Math.PI / 2);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 });
        
        const wheels = [];
        const wheelPositions = [
            [-1.0, 0.38, 1.35], [1.0, 0.38, 1.35],
            [-1.0, 0.38, -1.35], [1.0, 0.38, -1.35]
        ];
        wheelPositions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.position.set(...pos);
            car.add(wheel);
            wheels.push(wheel);
        });

        car.position.set(0, 0, 0);
        scene.add(car);

        // 🔊 오디오 시스템
        let audioCtx = null;
        let engineOsc = null;
        let engineGain = null;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            engineOsc = audioCtx.createOscillator();
            engineOsc.type = 'sawtooth';
            engineOsc.frequency.setValueAtTime(40, audioCtx.currentTime);

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(150, audioCtx.currentTime);

            engineGain = audioCtx.createGain();
            engineGain.gain.setValueAtTime(0, audioCtx.currentTime);

            engineOsc.connect(filter);
            filter.connect(engineGain);
            engineGain.connect(audioCtx.destination);
            engineOsc.start();
        }

        function playTickSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        let speed = 0;
        let maxSpeed = 1.3;
        let acceleration = 0.02;
        let deceleration = 0.012;
        let maxSteering = 0.045;

        let isLightOn = false;
        let leftBlinker = false;
        let rightBlinker = false;
        let hazardOn = false;
        let blinkTimer = 0;
        let isFirstPerson = false;

        let isDragging = false;
        let mouseX = 0, mouseY = 0;
        let cameraAngleY = 0;
        let cameraAngleX = 0.3;

        window.addEventListener('mousedown', (e) => { isDragging = true; mouseX = e.clientX; mouseY = e.clientY; initAudio(); });
        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - mouseX;
            const deltaY = e.clientY - mouseY;
            mouseX = e.clientX;
            mouseY = e.clientY;

            cameraAngleY -= deltaX * 0.005;
            cameraAngleX = Math.max(0.05, Math.min(1.2, cameraAngleX - deltaY * 0.005));
        });

        const keys = { up: false, down: false, left: false, right: false };

        window.addEventListener('keydown', (e) => handleKey(e, true));
        window.addEventListener('keyup', (e) => handleKey(e, false));

        function handleKey(e, isDown) {
            initAudio();
            
            if (e.key === 'ArrowUp') keys.up = isDown;
            if (e.key === 'ArrowDown') keys.down = isDown;
            if (e.key === 'ArrowLeft') keys.left = isDown;
            if (e.key === 'ArrowRight') keys.right = isDown;

            const key = e.key.toUpperCase();
            if (isDown) {
                if (key === 'L') {
                    isLightOn = !isLightOn;
                    headLightL.material.color.set(isLightOn ? 0xffffff : 0xffffaa);
                    document.getElementById('light-status').innerText = `라이트 (L): ${isLightOn ? 'ON' : 'OFF'}`;
                }
                if (key === 'Q') {
                    leftBlinker = !leftBlinker;
                    if (leftBlinker) rightBlinker = false;
                    document.getElementById('left-status').innerText = `좌측 깜빡이 (Q): ${leftBlinker ? 'ON' : 'OFF'}`;
                    document.getElementById('right-status').innerText = `우측 깜빡이 (E): ${rightBlinker ? 'ON' : 'OFF'}`;
                }
                if (key === 'E') {
                    rightBlinker = !rightBlinker;
                    if (rightBlinker) leftBlinker = false;
                    document.getElementById('right-status').innerText = `우측 깜빡이 (E): ${rightBlinker ? 'ON' : 'OFF'}`;
                    document.getElementById('left-status').innerText = `좌측 깜빡이 (Q): ${leftBlinker ? 'ON' : 'OFF'}`;
                }
                if (key === 'H') {
                    hazardOn = !hazardOn;
                    document.getElementById('hazard-status').innerText = `비상등 (H): ${hazardOn ? 'ON' : 'OFF'}`;
                }
                if (key === 'C') {
                    isFirstPerson = !isFirstPerson;
                    cameraAngleY = 0;
                }
            }
        }

        let lastBlinkState = false;

        function animate() {
            requestAnimationFrame(animate);

            if (keys.up) speed = Math.min(speed + acceleration, maxSpeed);
            else if (keys.down) speed = Math.max(speed - acceleration, -maxSpeed * 0.4);
            else {
                if (speed > 0) speed = Math.max(speed - deceleration, 0);
                if (speed < 0) speed = Math.min(speed + deceleration, 0);
            }

            if (Math.abs(speed) > 0.01) {
                if (keys.left) car.rotation.y += maxSteering * (speed / maxSpeed);
                if (keys.right) car.rotation.y -= maxSteering * (speed / maxSpeed);
            }

            car.translateZ(speed);
            wheels.forEach(w => { w.rotation.x -= speed * 2; });

            const kmh = Math.round(Math.abs(speed) * 180);
            document.getElementById('speedo').innerText = `${kmh} km/h`;

            // AI 차량 순환 이동
            aiCars.forEach(item => {
                item.mesh.position.z += item.speed;
                if (item.mesh.position.z > car.position.z + 500) item.mesh.position.z -= 1500;
                if (item.mesh.position.z < car.position.z - 500) item.mesh.position.z += 1500;
            });

            if (engineGain && audioCtx) {
                const engineVol = Math.min(0.25, Math.abs(speed) * 0.2);
                engineGain.gain.setTargetAtTime(engineVol, audioCtx.currentTime, 0.1);
                engineOsc.frequency.setTargetAtTime(40 + Math.abs(speed) * 90, audioCtx.currentTime, 0.1);
            }

            blinkTimer += 0.016;
            const currentBlinkState = Math.floor(blinkTimer * 3.5) % 2 === 0;
            if (currentBlinkState !== lastBlinkState && (hazardOn || leftBlinker || rightBlinker)) {
                playTickSound();
                lastBlinkState = currentBlinkState;
            }

            if (hazardOn || leftBlinker) {
                headLightL.material.color.set(currentBlinkState ? 0xffaa00 : 0x332200);
            }
            if (hazardOn || rightBlinker) {
                headLightR.material.color.set(currentBlinkState ? 0xffaa00 : 0x332200);
            }
            if (!hazardOn && !leftBlinker && !rightBlinker && !isLightOn) {
                headLightL.material.color.set(0xffffaa);
                headLightR.material.color.set(0xffffaa);
            }

            if (currentBlinkState !== lastBlinkState) {
                lastBlinkState = currentBlinkState;
            }

            if (isFirstPerson) {
                camera.position.set(
                    car.position.x - Math.sin(car.rotation.y) * 0.2,
                    car.position.y + 0.85,
                    car.position.z - Math.cos(car.rotation.y) * 0.2
                );
                const lookTarget = new THREE.Vector3(
                    car.position.x - Math.sin(car.rotation.y + cameraAngleY) * 20,
                    car.position.y + 0.85 + (cameraAngleX - 0.3) * 10,
                    car.position.z - Math.cos(car.rotation.y + cameraAngleY) * 20
                );
                camera.lookAt(lookTarget);
            } else {
                const dist = 7;
                const camX = car.position.x - Math.sin(car.rotation.y + cameraAngleY) * dist;
                const camZ = car.position.z - Math.cos(car.rotation.y + cameraAngleY) * dist;
                
                camera.position.x += (camX - camera.position.x) * 0.15;
                camera.position.z += (camZ - camera.position.z) * 0.15;
                camera.position.y = car.position.y + 1.5 + (cameraAngleX * 3);
                
                camera.lookAt(car.position.x, car.position.y + 0.5, car.position.z);
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
