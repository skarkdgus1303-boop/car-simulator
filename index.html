<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Perfect Car Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0b0b1a; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            pointer-events: none;
            width: 240px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h3 { margin: 0 0 12px 0; font-size: 18px; color: #3399ff; border-bottom: 1px solid #444; padding-bottom: 6px; }
        .dash { font-size: 28px; color: #00ffcc; text-align: right; margin-top: 10px; font-weight: bold; }
        .status { font-size: 13px; color: #ccc; margin: 5px 0; }
    </style>
</head>
<body>

    <div id="ui">
        <h3>🚗 DASHBOARD</h3>
        <div class="dash" id="speedo">0 km/h</div>
        <div class="status" id="light-status">라이트 (L): OFF</div>
        <div class="status" id="left-status">좌측 깜빡이 (Q): OFF</div>
        <div class="status" id="right-status">우측 깜빡이 (E): OFF</div>
        <div class="status" id="hazard-status">비상등 (H): OFF</div>
        <hr style="border:0; border-top:1px solid #444; margin:10px 0;">
        <div style="font-size:11px; color:#999; line-height: 1.5;">
            [↑ / ↓] 가속 및 후진<br>
            [← / →] 핸들 조작<br>
            [C] 시점 변경 (운전석 / 3인칭)
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b1a);
        scene.fog = new THREE.FogExp2(0x0b0b1a, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(40, 60, 40);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 도로 바닥
        const plane = new THREE.Mesh(
            new THREE.PlaneGeometry(2000, 2000),
            new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.8 })
        );
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

        const grid = new THREE.GridHelper(2000, 100, 0x333333, 0x222222);
        grid.position.y = 0.02;
        scene.add(grid);

        // 🚗 실제 자동차 형태를 정교하게 조립한 모델 (네트워크 오류 원천 차단)
        const car = new THREE.Group();

        // 차체 바닥
        const body = new THREE.Mesh(
            new THREE.BoxGeometry(2.1, 0.7, 4.4),
            new THREE.MeshStandardMaterial({ color: 0x0055ff, metalness: 0.7, roughness: 0.2 })
        );
        body.position.y = 0.55;
        body.castShadow = true;
        car.add(body);

        // 캐빈(유리창 및 지붕 부분)
        const cabin = new THREE.Mesh(
            new THREE.BoxGeometry(1.7, 0.6, 2.2),
            new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 })
        );
        cabin.position.set(0, 1.15, -0.2);
        cabin.castShadow = true;
        car.add(cabin);

        // 전조등 (라이트 & 깜빡이 표현용)
        const lightGeo = new THREE.BoxGeometry(0.4, 0.2, 0.1);
        const leftLightMat = new THREE.MeshBasicMaterial({ color: 0x555555 });
        const rightLightMat = new THREE.MeshBasicMaterial({ color: 0x555555 });

        const hLightL = new THREE.Mesh(lightGeo, leftLightMat);
        hLightL.position.set(-0.75, 0.6, -2.21);
        car.add(hLightL);

        const hLightR = new THREE.Mesh(lightGeo, rightLightMat);
        hLightR.position.set(0.75, 0.6, -2.21);
        car.add(hLightR);

        // 바퀴 4개
        const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 24);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const wheelPositions = [
            [-1.15, 0.4, 1.4], [1.15, 0.4, 1.4],
            [-1.15, 0.4, -1.4], [1.15, 0.4, -1.4]
        ];
        const wheels = [];
        wheelPositions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(...pos);
            car.add(wheel);
            wheels.push(wheel);
        });

        scene.add(car);

        // 주행 변수
        let speed = 0;
        let maxSpeed = 0.9;
        let acceleration = 0.015;
        let deceleration = 0.01;
        let maxSteering = 0.045;

        let isLightOn = false;
        let leftBlinker = false;
        let rightBlinker = false;
        let hazardOn = false;
        let blinkTimer = 0;
        let isFirstPerson = false;

        const keys = { up: false, down: false, left: false, right: false };

        window.addEventListener('keydown', (e) => handleKey(e, true));
        window.addEventListener('keyup', (e) => handleKey(e, false));

        function handleKey(e, isDown) {
            const key = e.key.toUpperCase();
            if (e.key === 'ArrowUp') keys.up = isDown;
            if (e.key === 'ArrowDown') keys.down = isDown;
            if (e.key === 'ArrowLeft') keys.left = isDown;
            if (e.key === 'ArrowRight') keys.right = isDown;

            if (isDown) {
                if (key === 'L') {
                    isLightOn = !isLightOn;
                    document.getElementById('light-status').innerText = `라이트 (L): ${isLightOn ? 'ON' : 'OFF'}`;
                }
                if (key === 'Q') {
                    leftBlinker = !leftBlinker;
                    if (leftBlinker) rightBlinker = false;
                    document.getElementById('left-status').innerText = `좌측 깜빡이 (Q): ${leftBlinker ? 'ON' : 'OFF'}`;
                    document.getElementById('right-status').innerText = `우측 깜빡이 (E): ${rightBlinker ? 'ON' : 'OFF'}`;
                }
                if (key === 'E') {
                    rightBlinker = !rightBlinker;
                    if (rightBlinker) leftBlinker = false;
                    document.getElementById('right-status').innerText = `우측 깜빡이 (E): ${rightBlinker ? 'ON' : 'OFF'}`;
                    document.getElementById('left-status').innerText = `좌측 깜빡이 (Q): ${leftBlinker ? 'ON' : 'OFF'}`;
                }
                if (key === 'H') {
                    hazardOn = !hazardOn;
                    document.getElementById('hazard-status').innerText = `비상등 (H): ${hazardOn ? 'ON' : 'OFF'}`;
                }
                if (key === 'C') {
                    isFirstPerson = !isFirstPerson;
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (keys.up) speed = Math.min(speed + acceleration, maxSpeed);
            else if (keys.down) speed = Math.max(speed - acceleration, -maxSpeed * 0.4);
            else {
                if (speed > 0) speed = Math.max(speed - deceleration, 0);
                if (speed < 0) speed = Math.min(speed + deceleration, 0);
            }

            if (Math.abs(speed) > 0.01) {
                if (keys.left) car.rotation.y += maxSteering * (speed / maxSpeed);
                if (keys.right) car.rotation.y -= maxSteering * (speed / maxSpeed);
            }

            car.translateZ(speed);
            wheels.forEach(w => w.rotation.x += speed * 2);

            const kmh = Math.round(Math.abs(speed) * 220);
            document.getElementById('speedo').innerText = `${kmh} km/h`;

            // 깜빡이 점멸 처리
            blinkTimer += 0.01;
            const blinkState = Math.floor(blinkTimer * 4) % 2 === 0;

            if (hazardOn) {
                leftLightMat.color.setHex(blinkState ? 0xffaa00 : 0x555555);
                rightLightMat.color.setHex(blinkState ? 0xffaa00 : 0x555555);
            } else {
                leftLightMat.color.setHex(leftBlinker ? (blinkState ? 0xffaa00 : 0x555555) : (isLightOn ? 0xffff99 : 0x555555));
                rightLightMat.color.setHex(rightBlinker ? (blinkState ? 0xffaa00 : 0x555555) : (isLightOn ? 0xffff99 : 0x555555));
            }

            if (isFirstPerson) {
                camera.position.set(
                    car.position.x - Math.sin(car.rotation.y) * 0.2,
                    car.position.y + 1.1,
                    car.position.z - Math.cos(car.rotation.y) * 0.2
                );
                const lookTarget = new THREE.Vector3(
                    car.position.x - Math.sin(car.rotation.y) * 15,
                    car.position.y + 1.1,
                    car.position.z - Math.cos(car.rotation.y) * 15
                );
                camera.lookAt(lookTarget);
            } else {
                const targetCamX = car.position.x - Math.sin(car.rotation.y) * 7;
                const targetCamZ = car.position.z - Math.cos(car.rotation.y) * 7;
                camera.position.x += (targetCamX - camera.position.x) * 0.12;
                camera.position.z += (targetCamZ - camera.position.z) * 0.12;
                camera.position.y = car.position.y + 2.4;
                camera.lookAt(car.position.x, car.position.y + 0.5, car.position.z);
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
