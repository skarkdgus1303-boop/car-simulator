<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Real Car Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050510; user-select: none; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            pointer-events: none;
            width: 260px;
            border: 1px solid rgba(0,255,200,0.3);
        }
        h3 { margin: 0 0 12px 0; font-size: 18px; color: #00ffcc; border-bottom: 1px solid #444; padding-bottom: 6px; }
        .dash { font-size: 30px; color: #00ffcc; text-align: right; margin-top: 10px; font-weight: bold; }
        .status { font-size: 13px; color: #ccc; margin: 5px 0; }
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            font-family: sans-serif;
            background: rgba(0,0,0,0.9);
            padding: 25px 40px;
            border-radius: 12px;
            border: 1px solid #00ffcc;
            z-index: 10;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="loading">🚗 실도로 환경 및 사운드 로딩 중...<br><span style="font-size:13px; color:#888;">잠시만 기다려주세요.</span></div>

    <div id="ui">
        <h3>🚘 HIGHWAY SIMULATOR</h3>
        <div class="dash" id="speedo">0 km/h</div>
        <div class="status" id="light-status">라이트 (L): OFF</div>
        <div class="status" id="left-status">좌측 깜빡이 (Q): OFF</div>
        <div class="status" id="right-status">우측 깜빡이 (E): OFF</div>
        <div class="status" id="hazard-status">비상등 (H): OFF</div>
        <hr style="border:0; border-top:1px solid #444; margin:10px 0;">
        <div style="font-size:11px; color:#aaa; line-height: 1.6;">
            [↑ / ↓] 가속 및 후진 / 엔진음 발생<br>
            [← / →] 핸들 조작<br>
            [마우스 드래그] 주변 둘러보기<br>
            [C] 운전석 / 3인칭 시점 전환
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.008);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 조명
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(50, 80, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 🛣️ 진짜 도로 환경 조성
        const roadGroup = new THREE.Group();
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
        const road = new THREE.Mesh(new THREE.PlaneGeometry(16, 10000), roadMat);
        road.rotation.x = -Math.PI / 2;
        road.receiveShadow = true;
        roadGroup.add(road);

        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        for(let i = -5000; i < 5000; i += 10) {
            const centerLine = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 5), lineMat);
            centerLine.rotation.x = -Math.PI / 2;
            centerLine.position.set(0, 0.01, i);
            roadGroup.add(centerLine);
        }

        const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const leftSidewalk = new THREE.Mesh(new THREE.BoxGeometry(4, 0.2, 10000), sidewalkMat);
        leftSidewalk.position.set(-10, 0.1, 0);
        roadGroup.add(leftSidewalk);

        const rightSidewalk = new THREE.Mesh(new THREE.BoxGeometry(4, 0.2, 10000), sidewalkMat);
        rightSidewalk.position.set(10, 0.1, 0);
        roadGroup.add(rightSidewalk);

        for(let i = -4000; i < 4000; i += 60) {
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 8), new THREE.MeshStandardMaterial({color: 0x444}));
            pole.position.set(-11, 4, i);
            roadGroup.add(pole);

            const bHeight = 40 + Math.random() * 60;
            const buildingMat = new THREE.MeshStandardMaterial({ color: 0x111622, roughness: 0.5 });
            const leftBldg = new THREE.Mesh(new THREE.BoxGeometry(25, bHeight, 30), buildingMat);
            leftBldg.position.set(-30, bHeight/2, i);
            roadGroup.add(leftBldg);

            const rightBldg = new THREE.Mesh(new THREE.BoxGeometry(25, bHeight, 30), buildingMat);
            rightBldg.position.set(30, bHeight/2, i);
            roadGroup.add(rightBldg);
        }
        scene.add(roadGroup);

        // 🔊 사운드 시스템
        let audioCtx = null;
        let engineOsc = null;
        let engineGain = null;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            engineOsc = audioCtx.createOscillator();
            engineOsc.type = 'sawtooth';
            engineOsc.frequency.setValueAtTime(40, audioCtx.currentTime);

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(150, audioCtx.currentTime);

            engineGain = audioCtx.createGain();
            engineGain.gain.setValueAtTime(0, audioCtx.currentTime);

            engineOsc.connect(filter);
            filter.connect(engineGain);
            engineGain.connect(audioCtx.destination);
            engineOsc.start();
        }

        function playTickSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        let car = null;
        let speed = 0;
        let maxSpeed = 1.2;
        let acceleration = 0.018;
        let deceleration = 0.012;
        let maxSteering = 0.045;

        let isLightOn = false;
        let leftBlinker = false;
        let rightBlinker = false;
        let hazardOn = false;
        let blinkTimer = 0;
        let isFirstPerson = false;

        let isDragging = false;
        let mouseX = 0, mouseY = 0;
        let cameraAngleY = 0;
        let cameraAngleX = 0.3;

        window.addEventListener('mousedown', (e) => { isDragging = true; mouseX = e.clientX; mouseY = e.clientY; initAudio(); });
        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - mouseX;
            const deltaY = e.clientY - mouseY;
            mouseX = e.clientX;
            mouseY = e.clientY;

            cameraAngleY -= deltaX * 0.005;
            cameraAngleX = Math.max(0.05, Math.min(1.2, cameraAngleX - deltaY * 0.005));
        });

        const keys = { up: false, down: false, left: false, right: false };

        // 🚗 3D 자동차 모델 및 DRACO 복호화 설정 적용
        const loader = new GLTFLoader();
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.5/'); //
        loader.setDRACOLoader(dracoLoader); //

        loader.load(
            'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/ferrari.glb',
            (gltf) => {
                car = gltf.scene;
                car.scale.set(1.1, 1.1, 1.1);
                car.position.set(0, 0, 0);
                
                car.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                scene.add(car);
                document.getElementById('loading').style.display = 'none';
                animate();
            },
            (xhr) => {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                if(percent) document.getElementById('loading').innerHTML = `🚗 도로 환경 로딩 중... ${percent}%`;
            },
            (error) => {
                console.error(error);
                document.getElementById('loading').innerHTML = '⚠️ 로딩 실패. 네트워크 또는 깃허브 설정을 확인해주세요.';
            }
        );

        window.addEventListener('keydown', (e) => handleKey(e, true));
        window.addEventListener('keyup', (e) => handleKey(e, false));

        function handleKey(e, isDown) {
            initAudio();
            const key = e.key.toUpperCase();
            if (e.key === 'ArrowUp') keys.up = isDown;
            if (e.key === 'ArrowDown') keys.down = isDown;
            if (e.key === 'ArrowLeft') keys.left = isDown;
            if (e.key === 'ArrowRight') keys.right = isDown;

            if (isDown) {
                if (key === 'L') {
                    isLightOn = !isLightOn;
                    document.getElementById('light-status').innerText = `라이트 (L): ${isLightOn ? 'ON' : 'OFF'}`;
                }
                if (key === 'Q') {
                    leftBlinker = !leftBlinker;
                    if (leftBlinker) rightBlinker = false;
                    document.getElementById('left-status').innerText = `좌측 깜빡이 (Q): ${leftBlinker ? 'ON' : 'OFF'}`;
                    document.getElementById('right-status').innerText = `우측 깜빡이 (E): ${rightBlinker ? 'ON' : 'OFF'}`;
                }
                if (key === 'E') {
                    rightBlinker = !rightBlinker;
                    if (rightBlinker) leftBlinker = false;
                    document.getElementById('right-status').innerText = `우측 깜빡이 (E): ${rightBlinker ? 'ON' : 'OFF'}`;
                    document.getElementById('left-status').innerText = `좌측 깜빡이 (Q): ${leftBlinker ? 'ON' : 'OFF'}`;
                }
                if (key === 'H') {
                    hazardOn = !hazardOn;
                    document.getElementById('hazard-status').innerText = `비상등 (H): ${hazardOn ? 'ON' : 'OFF'}`;
                }
                if (key === 'C') {
                    isFirstPerson = !isFirstPerson;
                    cameraAngleY = 0;
                }
            }
        }

        let lastBlinkState = false;

        function animate() {
            requestAnimationFrame(animate);
            if (!car) return;

            if (keys.up) speed = Math.min(speed + acceleration, maxSpeed);
            else if (keys.down) speed = Math.max(speed - acceleration, -maxSpeed * 0.4);
            else {
                if (speed > 0) speed = Math.max(speed - deceleration, 0);
                if (speed < 0) speed = Math.min(speed + deceleration, 0);
            }

            if (Math.abs(speed) > 0.01) {
                if (keys.left) car.rotation.y += maxSteering * (speed / maxSpeed);
                if (keys.right) car.rotation.y -= maxSteering * (speed / maxSpeed);
            }

            car.translateZ(speed);

            const kmh = Math.round(Math.abs(speed) * 180);
            document.getElementById('speedo').innerText = `${kmh} km/h`;

            if (engineGain && audioCtx) {
                const engineVol = Math.min(0.25, Math.abs(speed) * 0.2);
                engineGain.gain.setTargetAtTime(engineVol, audioCtx.currentTime, 0.1);
                engineOsc.frequency.setTargetAtTime(40 + Math.abs(speed) * 90, audioCtx.currentTime, 0.1);
            }

            blinkTimer += 0.016;
            const currentBlinkState = Math.floor(blinkTimer * 3.5) % 2 === 0;
            if (currentBlinkState !== lastBlinkState && (hazardOn || leftBlinker || rightBlinker)) {
                playTickSound();
                lastBlinkState = currentBlinkState;
            }

            if (isFirstPerson) {
                camera.position.set(
                    car.position.x - Math.sin(car.rotation.y) * 0.2,
                    car.position.y + 0.85,
                    car.position.z - Math.cos(car.rotation.y) * 0.2
                );
                const lookTarget = new THREE.Vector3(
                    car.position.x - Math.sin(car.rotation.y + cameraAngleY) * 20,
                    car.position.y + 0.85 + (cameraAngleX - 0.3) * 10,
                    car.position.z - Math.cos(car.rotation.y + cameraAngleY) * 20
                );
                camera.lookAt(lookTarget);
            } else {
                const dist = 7;
                const camX = car.position.x - Math.sin(car.rotation.y + cameraAngleY) * dist;
                const camZ = car.position.z - Math.cos(car.rotation.y + cameraAngleY) * dist;
                
                camera.position.x += (camX - camera.position.x) * 0.15;
                camera.position.z += (camZ - camera.position.z) * 0.15;
                camera.position.y = car.position.y + 1.5 + (cameraAngleX * 3);
                
                camera.lookAt(car.position.x, car.position.y + 0.5, car.position.z);
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
