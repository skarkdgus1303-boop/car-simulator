<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Real Korean Car Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; background: #080812; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.7);
            pointer-events: none;
            width: 250px;
            border: 1px solid rgba(0, 150, 255, 0.3);
        }
        h3 { margin: 0 0 12px 0; font-size: 18px; color: #00d2ff; border-bottom: 1px solid #444; padding-bottom: 6px; }
        .dash { font-size: 30px; color: #00ffcc; text-align: right; margin-top: 10px; font-weight: bold; }
        .status { font-size: 13px; color: #ddd; margin: 6px 0; }
        #car-name { font-size: 14px; color: #ffaa00; margin-bottom: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui">
        <h3>🚗 HYUNDAI / KIA SIM</h3>
        <div id="car-name">모델: 국산 프리미엄 세단</div>
        <div class="dash" id="speedo">0 km/h</div>
        <div class="status" id="light-status">라이트 (L): OFF</div>
        <div class="status" id="left-status">좌측 깜빡이 (Q): OFF</div>
        <div class="status" id="right-status">우측 깜빡이 (E): OFF</div>
        <div class="status" id="hazard-status">비상등 (H): OFF</div>
        <hr style="border:0; border-top:1px solid #444; margin:10px 0;">
        <div style="font-size:11px; color:#aaa; line-height: 1.6;">
            [↑ / ↓] 가속 및 후진<br>
            [← / →] 정교한 핸들링<br>
            [C] 1인칭(운전석) / 3인칭 전환<br>
            [1 / 2] 현대차 / 기아차 스타일 변경
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x080812);
        scene.fog = new THREE.FogExp2(0x080812, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 조명 설정
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
        dirLight.position.set(30, 50, 30);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 아스팔트 도로 바닥
        const plane = new THREE.Mesh(
            new THREE.PlaneGeometry(3000, 3000),
            new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.85 })
        );
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

        const grid = new THREE.GridHelper(3000, 150, 0x333333, 0x222222);
        grid.position.y = 0.02;
        scene.add(grid);

        // 🚗 진짜 자동차 디자인 구조물 조립 (현대/기아 스타일)
        const car = new THREE.Group();

        // 1. 차체 본넷 및 하부 (공기역학적 세단 라인)
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0033aa, metalness: 0.8, roughness: 0.2 }); // 기본 현대 블루 느낌
        const body = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.55, 4.5), bodyMat);
        body.position.y = 0.5;
        body.castShadow = true;
        car.add(body);

        // 2. 트렁크 및 프론트 노즈 세부 성형
        const hood = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.2, 1.6), bodyMat);
        hood.position.set(0, 0.75, 1.3);
        car.add(hood);

        // 3. 루프 및 유리창 (캐빈)
        const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 2.2), cabinMat);
        cabin.position.set(0, 1.05, -0.1);
        cabin.castShadow = true;
        car.add(cabin);

        // 4. 전면 그릴 및 헤드라이트 (라이트 조작 연동 매터리얼)
        const grill = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.3, 0.1), new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8 }));
        grill.position.set(0, 0.5, 2.26);
        car.add(grill);

        const headLightGeo = new THREE.BoxGeometry(0.4, 0.25, 0.1);
        const leftLightMat = new THREE.MeshBasicMaterial({ color: 0x444444 });
        const rightLightMat = new THREE.MeshBasicMaterial({ color: 0x444444 });

        const hLightL = new THREE.Mesh(headLightGeo, leftLightMat);
        hLightL.position.set(-0.75, 0.55, 2.27);
        car.add(hLightL);

        const hLightR = new THREE.Mesh(headLightGeo, rightLightMat);
        hLightR.position.set(0.75, 0.55, 2.27);
        car.add(hLightR);

        // 5. 휠 & 타이어 4개
        const wheelGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.28, 24);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 });
        const wheelPositions = [
            [-1.1, 0.38, 1.35], [1.1, 0.38, 1.35],
            [-1.1, 0.38, -1.35], [1.1, 0.38, -1.35]
        ];
        const wheels = [];
        wheelPositions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(...pos);
            wheel.castShadow = true;
            car.add(wheel);
            wheels.push(wheel);
        });

        scene.add(car);

        // 주행 변수
        let speed = 0;
        let maxSpeed = 0.95;
        let acceleration = 0.016;
        let deceleration = 0.01;
        let maxSteering = 0.045;

        let isLightOn = false;
        let leftBlinker = false;
        let rightBlinker = false;
        let hazardOn = false;
        let blinkTimer = 0;
        let isFirstPerson = false;

        const keys = { up: false, down: false, left: false, right: false };

        window.addEventListener('keydown', (e) => handleKey(e, true));
        window.addEventListener('keyup', (e) => handleKey(e, false));

        function handleKey(e, isDown) {
            const key = e.key.toUpperCase();
            if (e.key === 'ArrowUp') keys.up = isDown;
            if (e.key === 'ArrowDown') keys.down = isDown;
            if (e.key === 'ArrowLeft') keys.left = isDown;
            if (e.key === 'ArrowRight') keys.right = isDown;

            if (isDown) {
                if (key === 'L') {
                    isLightOn = !isLightOn;
                    document.getElementById('light-status').innerText = `라이트 (L): ${isLightOn ? 'ON' : 'OFF'}`;
                }
                if (key === 'Q') {
                    leftBlinker = !leftBlinker;
                    if (leftBlinker) rightBlinker = false;
                    document.getElementById('left-status').innerText = `좌측 깜빡이 (Q): ${leftBlinker ? 'ON' : 'OFF'}`;
                    document.getElementById('right-status').innerText = `우측 깜빡이 (E): ${rightBlinker ? 'ON' : 'OFF'}`;
                }
                if (key === 'E') {
                    rightBlinker = !rightBlinker;
                    if (rightBlinker) leftBlinker = false;
                    document.getElementById('right-status').innerText = `우측 깜빡이 (E): ${rightBlinker ? 'ON' : 'OFF'}`;
                    document.getElementById('left-status').innerText = `좌측 깜빡이 (Q): ${leftBlinker ? 'ON' : 'OFF'}`;
                }
                if (key === 'H') {
                    hazardOn = !hazardOn;
                    document.getElementById('hazard-status').innerText = `비상등 (H): ${hazardOn ? 'ON' : 'OFF'}`;
                }
                if (key === 'C') {
                    isFirstPerson = !isFirstPerson;
                }
                // [1] 키: 현대 스타일 (블루 세단)
                if (key === '1') {
                    bodyMat.color.setHex(0x0033aa);
                    document.getElementById('car-name').innerText = "모델: 현대 스타일 세단";
                }
                // [2] 키: 기아 스타일 (레드/시그니처 다크 그레이 SUV/세단 느낌)
                if (key === '2') {
                    bodyMat.color.setHex(0x990011);
                    document.getElementById('car-name').innerText = "모델: 기아 시그니처 스타일";
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (keys.up) speed = Math.min(speed + acceleration, maxSpeed);
            else if (keys.down) speed = Math.max(speed - acceleration, -maxSpeed * 0.4);
            else {
                if (speed > 0) speed = Math.max(speed - deceleration, 0);
                if (speed < 0) speed = Math.min(speed + deceleration, 0);
            }

            if (Math.abs(speed) > 0.01) {
                if (keys.left) car.rotation.y += maxSteering * (speed / maxSpeed);
                if (keys.right) car.rotation.y -= maxSteering * (speed / maxSpeed);
            }

            car.translateZ(speed);
            wheels.forEach(w => w.rotation.x += speed * 2.5);

            const kmh = Math.round(Math.abs(speed) * 220);
            document.getElementById('speedo').innerText = `${kmh} km/h`;

            // 라이트 및 깜빡이 점멸 제어
            blinkTimer += 0.01;
            const blinkState = Math.floor(blinkTimer * 4) % 2 === 0;

            if (hazardOn) {
                leftLightMat.color.setHex(blinkState ? 0xffaa00 : 0x444444);
                rightLightMat.color.setHex(blinkState ? 0xffaa00 : 0x444444);
            } else {
                leftLightMat.color.setHex(leftBlinker ? (blinkState ? 0xffaa00 : 0x444444) : (isLightOn ? 0xffff99 : 0x444444));
                rightLightMat.color.setHex(rightBlinker ? (blinkState ? 0xffaa00 : 0x444444) : (isLightOn ? 0xffff99 : 0x444444));
            }

            // 카메라 시점 (운전석 1인칭 vs 3인칭 추적)
            if (isFirstPerson) {
                camera.position.set(
                    car.position.x - Math.sin(car.rotation.y) * 0.15,
                    car.position.y + 0.95,
                    car.position.z - Math.cos(car.rotation.y) * 0.15
                );
                const lookTarget = new THREE.Vector3(
                    car.position.x - Math.sin(car.rotation.y) * 15,
                    car.position.y + 0.95,
                    car.position.z - Math.cos(car.rotation.y) * 15
                );
                camera.lookAt(lookTarget);
            } else {
                const targetCamX = car.position.x - Math.sin(car.rotation.y) * 7;
                const targetCamZ = car.position.z - Math.cos(car.rotation.y) * 7;
                camera.position.x += (targetCamX - camera.position.x) * 0.12;
                camera.position.z += (targetCamZ - camera.position.z) * 0.12;
                camera.position.y = car.position.y + 2.5;
                camera.lookAt(car.position.x, car.position.y + 0.5, car.position.z);
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
